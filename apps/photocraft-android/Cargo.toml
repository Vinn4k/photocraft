[package]
name = "photocraft-android"
description = "PhotoCraft on Android phones and tablets (eframe NativeActivity, wgpu on Vulkan)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The workspace forbids unsafe code; the NativeActivity entry point needs `#[no_mangle]`, which
# the lint counts as unsafe. As in photocraft-tablet, the crate denies it and allows only that
# one item (src/android.rs).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Built as the shared library a NativeActivity loads; `cargo xtask android` packs it into an APK
# with cargo-apk (docs/development.md › Android).
[lib]
name = "photocraft_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
photocraft-ui-egui = { workspace = true }
egui = { workspace = true }
log = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
photocraft-engine = { workspace = true }
photocraft-io = { workspace = true }
photocraft-codecs = { workspace = true }
photocraft-doc = { workspace = true }
eframe = { workspace = true, features = ["wgpu", "android-native-activity"] }
# AndroidApp for eframe's NativeOptions (eframe doesn't re-export winit). Already in Cargo.lock;
# pinned exactly to eframe's version.
winit = { version = "=0.30.13", default-features = false, features = ["android-native-activity"] }
android_logger = "0.15"
# JNI to ask Android for the window insets and for file access (system.rs): robius-android-env
# hands over the activity android-activity registers (ndk-context) behind a safe API; jni's own
# calls are safe.
robius-android-env = "=0.2.0"
jni = "0.21"
# Android's photo picker and file picker for File › Open. NativeActivity can't receive a picker's
# answer; this crate's small Java helper (compiled by its build script with javac and d8, so the
# build needs a JDK and the SDK's build-tools) receives it and calls back into Rust. Same
# project and jni as robius-android-env; pinned exactly: review the diff before bumping.
robius-file-picker = "=0.3.1"

# The file browser's tests (src/files_tests.rs) drive it on the build machine.
[dev-dependencies]
photocraft-engine = { workspace = true }
photocraft-io = { workspace = true }
photocraft-codecs = { workspace = true }
photocraft-doc = { workspace = true }
serde_json = { workspace = true }
eframe = { workspace = true }
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }

# cargo-apk's settings. The package id matches the desktop app's (`ai.storyteller.photocraft`);
# test builds are signed with the debug key cargo-apk creates (or the one in `[...release]`).
[package.metadata.android]
package = "ai.storyteller.photocraft"
apk_name = "photocraft"
build_targets = ["aarch64-linux-android"]
strip = "strip"
# The launcher icon: `cargo xtask android` copies assets/app-icon into res/ (not in git) first.
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 34

[package.metadata.android.application]
label = "PhotoCraft"
icon = "@mipmap/ic_launcher"
# No action bar: NativeActivity never draws it, but the default theme still reserves its height.
theme = "@android:style/Theme.DeviceDefault.NoActionBar"
# Vulkan for wgpu; the app keeps running when the screen rotates or the keyboard opens.
[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|keyboard|smallestScreenSize|density|uiMode"
launch_mode = "singleTask"
orientation = "unspecified"
resizeable_activity = true

# Files: "All files access" on Android 11+ (PhotoCraft opens and saves PSDs and other
# non-media files anywhere), the storage permissions before.
[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

# Photos on Android 13+: listed under the app's Permissions, and enough to open images when
# "All files access" is off.
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_IMAGES"

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 29

[[package.metadata.android.uses_feature]]
name = "android.hardware.vulkan.level"
required = true
version = 1
